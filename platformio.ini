[platformio]
default_envs = m5stack-sticks3

[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DM5GFX_BOARD=board_M5StickS3
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Unified@^0.2.19
    m5stack/M5PM1@^1.0.7
    links2004/WebSockets@^2.7.3
test_ignore = test_core

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=c++17
    -DUNIT_TEST
build_src_filter =
    +<input/>
    +<audio/AudioBuffer.cpp>
    +<asr/VolcAsrProtocol.cpp>
    +<ui/OrientationController.cpp>
    +<ui/PageModel.cpp>
    -<main.cpp>
